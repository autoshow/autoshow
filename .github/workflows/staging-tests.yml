name: Staging Tests

on:
  pull_request:
    branches:
      - staging
      - main
      - production
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: sqlite://./data/autoshow.sqlite
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Verify runner help
        run: |
          bun as runner
          bun as runner --help

      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production

      - name: Start built server
        run: |
          mkdir -p artifacts/logs
          nohup bun run start > artifacts/logs/staging-server.log 2>&1 &
          echo $! > staging-server.pid
        env:
          NODE_ENV: production
          PORT: 4321
          HOST: 0.0.0.0

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/api/health > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          tail -n 200 artifacts/logs/staging-server.log || true
          exit 1

      - name: Stop built server
        if: always()
        run: |
          if [ -f staging-server.pid ]; then
            kill "$(cat staging-server.pid)" || true
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-artifacts
          path: |
            artifacts/logs/
            staging-server.pid
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "✓ Test suite completed"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
